<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra de Post-its Interactivos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Lienzo donde se colocarán todos los post-its -->
    <div id="pizarra">
        <h1>Post-its</h1>
    </div>

    <!-- Botón flotante para CREAR notas -->
    <button id="btn-crear" class="fab">+</button>

    <!-- Modal exclusivo para CREAR -->
    <div id="modal-crear" class="modal">
        <div class="modal-contenido">
            <h2>Crear Post-it</h2>

            <textarea id="input-texto-crear" placeholder="¿Qué quieres anotar?" rows="4"></textarea>

            <div class="selector-color">
                <label for="input-color-crear">Color de fondo:</label>
                <input type="color" id="input-color-crear" value="#fffa65">
            </div>

            <div class="acciones-modal">
                <button id="btn-guardar-crear">Guardar Nota</button>
                <button id="btn-cancelar-crear">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal para ACTUALIZAR / EDITAR notas -->
    <div id="modal-edicion" class="modal">
        <div class="modal-contenido">
            <h2 id="modal-titulo">Editar Nota</h2>

            <textarea id="input-texto" placeholder="Escribe tu nota aquí..." rows="4"></textarea>

            <div class="selector-color">
                <label for="input-color">Color de fondo:</label>
                <input type="color" id="input-color" value="#fffa65">
            </div>

            <div class="acciones-modal">
                <button id="btn-guardar">Guardar Cambios</button>
                <button id="btn-cancelar-edicion">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para BORRAR notas -->
    <div id="modal-borrar" class="modal">
        <div class="modal-contenido">
            <h2>¿Eliminar esta nota?</h2>
            <p>Esta acción es definitiva y se borrará de Firebase.</p>

            <div class="acciones-modal">
                <button id="btn-confirmar-borrar">Sí, eliminar</button>
                <button id="btn-cancelar-borrar">Cancelar</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>

</html>
